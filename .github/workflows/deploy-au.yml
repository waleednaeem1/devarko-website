name: Deploy AU site to Hostinger

on:
  push:
    branches: [main]
    paths:
      - "au/**"
      - ".github/workflows/deploy-au.yml"
  workflow_dispatch:

concurrency:
  group: deploy-au-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and sync devarko.com.au
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: au
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: au/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy over FTP
        id: deploy
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: "178.16.136.115"
          protocol: ftps
          timeout: 60000
          username: ${{ secrets.AU_FTP_USERNAME }}
          password: ${{ secrets.AU_FTP_PASSWORD }}
          local-dir: au/out/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-au.json
          exclude: |
            **/.git*
            **/.git*/**

      - name: Retry deploy once on transient failure
        if: steps.deploy.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: "178.16.136.115"
          protocol: ftps
          timeout: 90000
          username: ${{ secrets.AU_FTP_USERNAME }}
          password: ${{ secrets.AU_FTP_PASSWORD }}
          local-dir: au/out/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-au.json
          exclude: |
            **/.git*
            **/.git*/**
